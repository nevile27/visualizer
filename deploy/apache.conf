<VirtualHost *:8080>
    ServerName hallplan
    DocumentRoot /var/www/hallplan

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8091/api/
    ProxyPassReverse /api/ http://127.0.0.1:8091/api/

    <Directory /var/www/hallplan>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hallplan-error.log
    CustomLog ${APACHE_LOG_DIR}/hallplan-access.log combined
</VirtualHost>
